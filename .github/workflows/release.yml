name: Stable Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node and GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rendevouz999'

      - name: Validate tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $($env:GITHUB_REF_NAME) does not match package version $expected"
          }

      - name: Install dependencies
        run: npm ci

      - name: Full release verification
        run: npm run verify:release

      - name: Explicit execution performance gates
        shell: pwsh
        run: |
          $env:AGENT_CORE_PERFORMANCE_GATES = '1'
          npx vitest run tests/execution-performance.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build stable release artifacts
        run: npm run package:release

      - name: Extract release notes
        run: node scripts/release/extract-release-notes.mjs release-notes.md

      - name: Create or refresh draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assetDir = Join-Path 'release' "v$version\assets"
          $assets = Get-ChildItem $assetDir -File | ForEach-Object { $_.FullName }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "Agent Core $tag — Stable" --notes-file release-notes.md --draft=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --title "Agent Core $tag — Stable" --notes-file release-notes.md --draft --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish stable GitHub Package
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packageName = '@rendevouz999/agent-core-plugin'
          npm view "$packageName@$version" version --registry=https://npm.pkg.github.com *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "$packageName@$version already exists; keeping the existing immutable package version."
          } else {
            $publishDir = Join-Path 'release' "v$version\staging\agent-core-plugin"
            Push-Location $publishDir
            try {
              npm publish --tag stable
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Pop-Location
            }
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Emit temporary release receipt tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $receiptTag = "release-receipt/v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f -a $receiptTag -m "release=published package=@rendevouz999/agent-core-plugin@$version dist-tag=stable"
          git push --force origin "refs/tags/$receiptTag"
